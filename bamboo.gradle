import java.nio.file.*
import org.apache.commons.io.FileUtils

buildscript{
	repositories {
		mavenCentral()
		jcenter()
		maven {
			url "https://plugins.gradle.org/m2/"                    // Needed to pull gretty dependencies
		}

	}

	dependencies{
		classpath "commons-io:commons-io:2.5"
	}
}
apply plugin: 'java'
apply plugin: 'war'

def tomcatVersion = "7.0.53"
def warName = "wwwapps"

war{
	archiveName = warName + ".war"
}

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile) {
	options.incremental = true
}

configurations {
    jasper
}

dependencies {

	jasper "org.apache.tomcat:tomcat-catalina-ant:${tomcatVersion}"
    jasper "org.apache.tomcat:tomcat-catalina:${tomcatVersion}"
    jasper "org.apache.tomcat:tomcat-jasper:${tomcatVersion}"

    jasper 'javax.servlet.jsp.jstl:jstl-api:1.2'
    jasper "org.glassfish.web:jstl-impl:1.2"
    jasper "taglibs:standard:1.1.2"

 	//this was defined in settings.gradle file
	compile files('../WARNJAVALIBPRJ-WARNJAVALIBCOMPILE-JOB1/build/libs/WarnJava-1.0-SNAPSHOT.jar')
	//compile files('../WarnJavaLib/build/libs/WarnJava-1.0-SNAPSHOT.jar')

	// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
	compile group: 'javax.xml.bind', name: 'jaxb-api', version: '2.2.4'



	// https://mvnrepository.com/artifact/org.glassfish.jersey.containers/jersey-container-servlet-core
	compile "org.glassfish.jersey.containers:jersey-container-servlet-core:2.25.1"
	compile "org.glassfish.jersey.containers:jersey-container-servlet:2.25.1"
	compile "org.glassfish.jersey.media:jersey-media-multipart:2.25.1"

	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
	compile group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.8.8'
	compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version:'2.8.8'
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-mapper-asl

	compile group: 'org.codehaus.jackson', name: 'jackson-mapper-asl', version: '1.9.2'
	compile group: 'org.codehaus.jackson', name: 'jackson-xc', version: '1.9.2'
	compile group: 'org.codehaus.jackson', name: 'jackson-core-asl', version: '1.9.2'
	compile group: 'org.codehaus.jackson', name: 'jackson-jaxrs', version: '1.9.2'

	 // SL4J
     compile "org.slf4j:slf4j-log4j12:1.7.12"
     compile "org.slf4j:jcl-over-slf4j:1.7.12"

    // SL4J
    compile "org.slf4j:slf4j-log4j12:1.7.12"
    compile "org.slf4j:jcl-over-slf4j:1.7.12"

	//stuff that lives in Tomcats core lib folder or in the bin folder
    providedCompile "org.apache.tomcat:tomcat-catalina:${tomcatVersion}"
    providedCompile "org.apache.tomcat:tomcat-jasper:${tomcatVersion}"

	compile "javax.mail:mail:1.5.0-b01"

	//needed for URL rewrite
	compile group: 'org.tuckey', name: 'urlrewritefilter', version: '4.0.4'

	// https://mvnrepository.com/artifact/org.springframework/spring-web
	compile group: 'org.springframework', name: 'spring-web', version: '5.2.0.RELEASE'

	//testing
    testCompile group: 'junit', name: 'junit', version: '4.11'
	testCompile group: 'com.google.guava', name: 'guava', version: '21.0'

	testCompile group: 'org.hamcrest', name: 'hamcrest-all', version: '1.3'



}
