// ***************************** BEGIN JDE DB SETTINGS ********************
// EP: JDE settings here are accessed via the com.warn.jde.dao.JDEDBConn. Make sure these agree with the pool settings in conf/server.xml

// JDE Engine Names: this is where the JDE_CRP/JDE_DEVELOPMENT/JDE_PRODUCTION and JDE_PY910 alt values are jde-dbtest and jde-dbprod.
// Dont forget to use square brackets when using these values because of the hyphens. DO NOT PUT BRACKETS HERE
JDE_ENGINE_NAME ="jde-dbtest"

// JDE System Engine Name: this is where the JDE910 db is located. Options: jde-dbtest, jde-dbprod
JDE_SYSTEM_ENGINE_NAME ="jde-dbtest"

// JDE DB Names: vary with which of our 3 "environments" you are in: dev/test, user test (aka CRP (aka Conference Room Prototype)) or production -->
// DB names: alt values are JDE_DEVELOPMENT, JDE_CRP and JDE_PRODUCTION -->
JDE_BUSINESS_DB_NAME ="JDE_CRP"

// DB names: alt values are JDE_DV910 (dev), JDE_PY910 (user test), and JDE_PD910 prod
JDE_CONTROL_DB_NAME ="JDE_PY910"

// DB names: alt values are ONLY JDE910. JDE910 db has same name on both engines for each "environment".
JDE_SYSTEM_DB_NAME ="JDE910"


// JDE Table Owner Names: vary with whether you are in dev, user test or prod
// Table Owner Names: alt values are TESTDTA, CRPDTA(test), and PRODDTA (prod)
JDE_BUSINESS_DATA_OWNER ="CRPDTA"

// Table Owner Names: alt values are TESTCTL, CRPCTL and PRODCTL
JDE_BUSINESS_CONTROL_OWNER ="CRPCTL"

// Table Owner Names: alt values are DV910, PY910 and PD910
JDE_CONTROL_OWNER ="PY910"

// Table Owner Names: only 1 value for sys: SYS910 -->
JDE_SYSTEM_OWNER ="SY910"

// Table Owner Names: only 1 value for sys: SVM910 -->
JDE_SYSTEM_SERVERMAP_OWNER ="SVM910"

// SHOULD BE ENGINE NAME alt values are WARN-DB, WARN-TESTDB
WARN_DB_ENGINE_NAME ="WARN-TESTDB"

// ******************************** END JDE DB SETTINGS ***************************

