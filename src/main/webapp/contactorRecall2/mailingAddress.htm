<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<title>Reimbursement Address</title>
	
	<link rel="stylesheet" href="contactorRecall.css">
	<script src="/wwwapps/shared/jquery/jquery-3.1.0.js"></script>
	
	<script src="mailingAddress.js"></script>
	
</head>
<body>
<div class="mainDiv">
	<table class="logoAndTitleTable">
		<tr>
			<td>
				<a href="/index.shtml"><img src="/wwwapps/shared/WarnLogoWeb.gif" border="0"></a>
				<span class="titleSpan">ATV Contactor Recall</span>
			</td>
		</tr>
	</table>
	<h2>Mailing Address For Reimbursement Checks</h2>
	<form id="addressForm" onsubmit="save(event);">
		<input id="action" value="" type="hidden">
		<input name="phone" id="phone" value="" type="hidden">
		<table class="formTable">
			<tr>
				<td>Address Line1:</td>
				<td><input name="address1" id="address1" type="text" value="" size="30"></td>
			</tr>
			<tr>
				<td>Address Line2:</td>
				<td><input name="address2" id="address2" type="text" value="" size="30"></td>
			</tr>
			<tr>
				<td>City:</td>
				<td><input name="city" id="city" type="text"	value="" size="30"></td>
			</tr>
			<tr>
				<td>State:</td>
				<td><input name="stateCode" id="stateCode" value="" type="hidden">
					<input name="countryCode" id="countryCode" value="" type="hidden">
					<select name="state" id="state" onChange="stateSelectorChanged();" >
						<option value="-1">Please Select
						<option value="AL~US">Alabama

						<option value="HI~US">Hawaii
						<option value="ID~US">Idaho
						<option value="IL~US">Illinois
						<option value="IN~US">Indiana
						<option value="IA~US">Iowa
						<option value="KS~US">Kansas
						<option value="KY~US">Kentucky
						<option value="LA~US">Louisiana
						<option value="ME~US">Maine
						<option value="MB~CA">Manitoba
						<option value="MD~US">Maryland
						<option value="MA~US">Massachusetts
						<option value="MI~US">Michigan
						<option value="MN~US">Minnesota
						<option value="MS~US">Mississippi
						<option value="MO~US">Missouri
						<option value="MT~US">Montana
						<option value="NE~US">Nebraska
						<option value="NV~US">Nevada
						<option value="NB~CA">New Brunswick
						<option value="NH~US">New Hampshire
						<option value="NJ~US">New Jersey
						<option value="NM~US">New Mexico
						<option value="NY~US">New York
						<option value="NF~CA">Newfoundland
						<option value="NL~CA">Newfoundland and Labrador
						<option value="NC~US">North Carolina
						<option value="ND~US">North Dakota
						<option value="NT~CA">Northwest Territories
						<option value="NS~CA">Nova Scotia
						<option value="NU~CA">Nunavut
						<option value="OH~US">Ohio
						<option value="OK~US">Oklahoma
						<option value="ON~CA">Ontario
						<option value="OR~US">Oregon
						<option value="PA~US">Pennsylvania
						<option value="PE~CA">Prince Edwards Island
						<option value="PR~US">Puerto Rico

			</tr>
			<tr>
				<td>Zip Code:</td>
				<td><input name="zip" id="zip" type="text" value=""	size="30"></td>
			</tr>
			<tr>
				<td>&nbsp;</td>
				<td align="left"><input type="submit"	value="submit"></td>
			</tr>
		</table>

</html>
